name: PyTest Framework - Python
on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
 
permissions:
  contents: read
 
jobs:
  test:
    runs-on: ubuntu-latest
 
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: 3.13
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
     
      - name: Test with PyTest
        run: pytest --html=tests/Reports/Report.html  
 
      - name: actions-pytest
        # You may pin to the exact commit or the version.
        # uses: xoviat/actions-pytest@6e27d0810b47a907cc45bc96092599f072b28870
        uses: xoviat/actions-pytest@0.1-alpha2
        with:
          # Arguments for the pytest command
          verbose: true
          emoji: true
          job-summary: true
          # custom-arguments: '-q'
          click-to-expand: true
          report-title: 'Test Report (sax)'
